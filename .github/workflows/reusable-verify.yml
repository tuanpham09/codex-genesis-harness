name: Reusable Harness Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Run genesis-harness verify-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify-gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node bin/genesis-harness.js verify-gate | tee artifacts/verify-gate.log

      - name: Capture package manifest
        run: npm pack --json > artifacts/npm-pack.json

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-verification-${{ github.run_id }}
          path: |
            artifacts/
            .codebase/CURRENT_STATE.md
            .codebase/TEST_MATRIX.md
            features/REGISTRY.md
          if-no-files-found: error
